<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account — CreatorOS AI</title>
<meta name="description" content="Join CreatorOS AI as a Brand hiring AI talent or as an AI Content Creator.">
<meta name="theme-color" content="#07080c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='19' font-weight='700' text-anchor='middle' fill='%2306070b'%3EC%3C/text%3E%3C/svg%3E">
</head>
<body data-page="signup">
<header class="nav" id="nav"></header>

<main class="section-tight" style="padding-top:var(--sp-7);padding-bottom:var(--sp-8)">
  <div class="wrap" style="max-width:480px">
    <div class="card p-6" style="border:1px solid var(--line-strong);background:radial-gradient(ellipse at 50% 0%, rgba(0,229,195,0.12), var(--ink-800))">
      
      <div class="text-center mb-4">
        <span class="eyebrow eyebrow-mint">Get Started</span>
        <h1 class="mt-2" style="font-size:1.7rem">Join CreatorOS AI</h1>
        <p class="sub mt-1" style="font-size:.88rem">Create your separate Brand or Creator profile.</p>
      </div>

      <div class="tabs mb-4" role="tablist">
        <a class="tab" href="login.html">Sign in</a>
        <a class="tab" href="signup.html" aria-selected="true" style="color:var(--text);border-color:var(--mint)">Create account</a>
      </div>

      <form id="standaloneSignUpForm" class="stack" style="gap:var(--sp-3)">
        
        <!-- Role Selection -->
        <label class="field">
          <span class="field-label">I am joining as</span>
          <select class="select" id="signupRole" style="border-color:var(--line-strong);background:var(--ink-750)">
            <option value="creator" selected>AI Content Creator (Offering Services &amp; Portfolio)</option>
            <option value="brand">Brand / Client (Hiring Creators &amp; Posting Briefs)</option>
          </select>
        </label>

        <label class="field">
          <span class="field-label">Full Name or Brand Name</span>
          <input class="input" id="signupName" required placeholder="e.g. Vamshi VFX or Nexus Studios" autofocus>
        </label>

        <label class="field">
          <span class="field-label">Email address</span>
          <input class="input" id="signupEmail" type="email" required placeholder="name@company.com">
        </label>

        <label class="field">
          <span class="field-label">Password (min 6 characters)</span>
          <input class="input" id="signupPassword" type="password" minlength="6" required placeholder="••••••••">
        </label>

        <button class="btn btn-primary mt-2" type="submit" id="btnSignUpSubmit" style="width:100%">Create account</button>
      </form>

      <div class="text-center mt-4" style="border-top:1px solid var(--line);padding-top:16px">
        <span class="tiny" style="color:var(--muted)">Already have an account?</span>
        <a href="login.html" class="tiny ml-2" style="color:var(--violet);font-weight:600">Sign in to your account →</a>
      </div>
    </div>
  </div>
</main>

<footer class="footer" id="footer"></footer>

<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  UI.mountNav("signup");
  UI.mountFooter();

  const form = document.getElementById("standaloneSignUpForm");
  form?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;
    const role = document.getElementById("signupRole").value;
    const btn = document.getElementById("btnSignUpSubmit");
    btn.disabled = true;
    btn.textContent = "Creating account...";

    try {
      if (typeof SupabaseBridge !== "undefined") {
        await SupabaseBridge.signUp({ email, password, name, role });
        UI.toast("Account created! Redirecting to setup your profile...", "ok");
        setTimeout(() => {
          window.location.href = role === "creator" ? "creator-profile.html" : "brand-profile.html";
        }, 600);
      }
    } catch (err) {
      UI.toast(err.message || "Failed to create account", "err");
      btn.disabled = false;
      btn.textContent = "Create account";
    }
  });
});
</script>
</body>
</html>
